<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Osobná stránka na precvičovanie testov z autoškoly.">
    <title>Autoškola – testy</title>

    <!-- Ikonka stránky (jantárový štvorec s deliacou čiarou cesty) -->
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FFB400'/%3E%3Cpath d='M16 5v5M16 13.5v5M16 22v5' stroke='%230F1623' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

    <!-- Písma z Google Fonts sú len BONUS. Keď nie si online, stránka použije systémové písma
       a funguje úplne rovnako. Načítavajú sa neblokujúco (media="print" -> "all"). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Doto:wght@600..900&family=Figtree:wght@400..700&display=swap">

    <link rel="stylesheet" href="style.css">

    <!-- Téma sa nastaví hneď na začiatku, aby pri načítaní neblikla zlá farba -->
    <script>
        (function () {
            try {
                var t = JSON.parse(localStorage.getItem('autoskola.v1.theme'));
                if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <a class="skip-link" href="#app">Preskočiť na obsah</a>

    <!-- Sada ikon (SVG sprite). Používajú sa cez <use href="#i-...">. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-check" viewBox="0 0 24 24">
                <path d="M5 12.5l4.5 4.5L19 7.5" />
            </symbol>
            <symbol id="i-x" viewBox="0 0 24 24">
                <path d="M6 6l12 12M18 6L6 18" />
            </symbol>
            <symbol id="i-star" viewBox="0 0 24 24">
                <path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8L12 3.5z" />
            </symbol>
            <symbol id="i-skip" viewBox="0 0 24 24">
                <path d="M5 5.5l9 6.5-9 6.5v-13zM18.5 5v14" />
            </symbol>
            <symbol id="i-back" viewBox="0 0 24 24">
                <path d="M15 5l-7 7 7 7" />
            </symbol>
            <symbol id="i-next" viewBox="0 0 24 24">
                <path d="M9 5l7 7-7 7" />
            </symbol>
            <symbol id="i-sun" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" />
            </symbol>
            <symbol id="i-moon" viewBox="0 0 24 24">
                <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
            </symbol>
            <symbol id="i-stop" viewBox="0 0 24 24">
                <rect x="6" y="6" width="12" height="12" rx="2.5" />
            </symbol>
            <symbol id="i-list" viewBox="0 0 24 24">
                <path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01" />
            </symbol>
            <symbol id="i-chart" viewBox="0 0 24 24">
                <path d="M5 20V11M12 20V4M19 20v-6" />
            </symbol>
            <symbol id="i-road" viewBox="0 0 24 24">
                <path d="M12 3v4M12 10v4M12 17v4M6 21L9 3M18 21L15 3" />
            </symbol>
            <symbol id="i-play" viewBox="0 0 24 24">
                <path d="M7 4.5l12 7.5-12 7.5v-15z" />
            </symbol>
            <symbol id="i-download" viewBox="0 0 24 24">
                <path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19.5h14" />
            </symbol>
            <symbol id="i-upload" viewBox="0 0 24 24">
                <path d="M12 15V4m0 0L8 8m4-4l4 4M5 19.5h14" />
            </symbol>
            <symbol id="i-trash" viewBox="0 0 24 24">
                <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5h10L18 7M9 7V4.5h6V7" />
            </symbol>
            <symbol id="i-search" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="6.5" />
                <path d="M20 20l-4.2-4.2" />
            </symbol>
            <symbol id="i-clock" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8.5" />
                <path d="M12 7.5V12l3 2" />
            </symbol>
            <symbol id="i-image" viewBox="0 0 24 24">
                <rect x="3.5" y="5" width="17" height="14" rx="2.5" />
                <circle cx="9" cy="10.5" r="1.6" />
                <path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5" />
            </symbol>
            <symbol id="i-repeat" viewBox="0 0 24 24">
                <path d="M4 11a8 8 0 0 1 14-4.5L20 9M20 4v5h-5M20 13a8 8 0 0 1-14 4.5L4 15M4 20v-5h5" />
            </symbol>
            <symbol id="i-save" viewBox="0 0 24 24">
                <path d="M5 4.5h11l3 3V19.5H5v-15zM8 4.5v5h7v-5M8 19.5v-6h8v6" />
            </symbol>
            <symbol id="i-zoom" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="6.5" />
                <path d="M20 20l-4.2-4.2M11 8.5v5M8.5 11h5" />
            </symbol>
        </defs>
    </svg>

    <header class="topbar">
        <div class="topbar-in">
            <a class="brand" href="#/" aria-label="Autoškola, úvodná obrazovka">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="9" />
                    <path d="M16 5v5M16 13.5v5M16 22v5" />
                </svg>
                <span class="brand-name">Autoškola</span>
            </a>

            <nav class="topnav" aria-label="Hlavná navigácia">
                <a href="#/" data-nav="home"><svg class="icon" aria-hidden="true">
                        <use href="#i-road" />
                    </svg><span>Test</span></a>
                <a href="#/browse" data-nav="browse"><svg class="icon" aria-hidden="true">
                        <use href="#i-list" />
                    </svg><span>Otázky</span></a>
                <a href="#/stats" data-nav="stats"><svg class="icon" aria-hidden="true">
                        <use href="#i-chart" />
                    </svg><span>Štatistiky</span></a>
            </nav>

            <button type="button" class="btn-icon" id="theme-toggle" aria-label="Prepnúť svetlý a tmavý režim">
                <svg class="icon icon-moon" aria-hidden="true">
                    <use href="#i-moon" />
                </svg>
                <svg class="icon icon-sun" aria-hidden="true">
                    <use href="#i-sun" />
                </svg>
            </button>
        </div>
    </header>

    <main id="app" tabindex="-1">
        <noscript>
            <p style="padding:24px">Táto stránka potrebuje zapnutý JavaScript.</p>
        </noscript>
    </main>

    <!-- Spodná navigácia na mobile (na počítači sa skryje) -->
    <nav class="tabbar" aria-label="Hlavná navigácia (mobil)">
        <a href="#/" data-nav="home"><svg class="icon" aria-hidden="true">
                <use href="#i-road" />
            </svg><span>Test</span></a>
        <a href="#/browse" data-nav="browse"><svg class="icon" aria-hidden="true">
                <use href="#i-list" />
            </svg><span>Otázky</span></a>
        <a href="#/stats" data-nav="stats"><svg class="icon" aria-hidden="true">
                <use href="#i-chart" />
            </svg><span>Štatistiky</span></a>
    </nav>

    <div id="toasts" role="status" aria-live="polite"></div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
